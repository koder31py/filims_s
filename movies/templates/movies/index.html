<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Фильмы</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        .movies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .movie-card {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .movie-poster {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-radius: 4px;
        }
        .movie-title {
            font-size: 1.5em;
            margin: 10px 0;
            color: #333;
        }
        .movie-description {
            color: #666;
            line-height: 1.4;
        }
        .trailer-link {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 15px;
            background-color: #007bff;
            color: white;
            text-decoration: none;
            border-radius: 4px;
        }
        .trailer-link:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Популярные фильмы</h1>
        <div class="movies-grid">
            {% for movie in movies %}
            <div class="movie-card">
                <img src="/static/{{ movie.poster }}" alt="{{ movie.title }}" class="movie-poster">
                <h2 class="movie-title">{{ movie.title }}</h2>
                <p class="movie-description">{{ movie.description }}</p>
                <a href="{{ movie.trailer }}" target="_blank" class="trailer-link">Смотреть трейлер</a>
            </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
